services:
  lan-portaal:
    build: .
    container_name: vives-lan-portaal
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - DATA_DIR=/app/data
      - THEMES_DIR=/app/custom-themes
    volumes:
      - lan-data:/app/data
      # Eigen thema's: zet een map in ./custom-themes, geen herbouw nodig (zie custom-themes/README.md)
      - ./custom-themes:/app/custom-themes:ro

volumes:
  lan-data:
